<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>GraphQL</title><link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/><link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet"/><script>// Only run GitHub Pages specific scripts in production
      if (
        window.location.hostname !== "localhost" &&
        window.location.hostname !== "127.0.0.1"
      ) {
        // Single Page Apps for GitHub Pages
        (function (l) {
          if (l.search[1] === "/") {
            var decoded = l.search
              .slice(1)
              .split("&")
              .map(function (s) {
                return s.replace(/~and~/g, "&");
              })
              .join("?");
            window.history.replaceState(
              null,
              null,
              l.pathname.slice(0, -1) + decoded + l.hash
            );
          }
        })(window.location);

        // Redirect all 404s to index.html in production
        (function () {
          if (
            window.location.hostname !== "localhost" &&
            window.location.hostname !== "127.0.0.1" &&
            window.location.pathname.indexOf("/Graphql") !== 0
          ) {
            window.location.href = "/Graphql" + window.location.pathname;
          }
        })();
      }</script><style>* {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "Roboto", sans-serif;
        background-color: #f5f5f5;
      }</style><script defer="defer" src="/Graphql/bundle.js"></script></head><body><div id="root"></div></body></html>
